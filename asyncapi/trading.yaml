asyncapi: '3.0.0'
info:
  title: Bit2Me Pro Trading WebSocket
  version: '1.0.0'
  description: |
    Spot WebSocket at `wss://ws.bit2me.com/v1/trading`.
    Public channels do not require authentication.
    Private channels require a token from `POST /v1/signin/apikey` (1 minute TTL)
    and an `authenticate` event.
  contact:
    name: Bit2Me Support
    url: https://support.bit2me.com
servers:
  production:
    host: ws.bit2me.com
    pathname: /v1/trading
    protocol: wss
    description: Pro Trading Spot WebSocket
channels:
  orderBook:
    address: order-book
    description: Level 2 order book. Subscribe with event subscribe and subscription.name order-book.
    messages:
      orderBook:
        $ref: '#/components/messages/orderBook'
  publicTrades:
    address: public-trades
    description: Public last trades for a symbol.
    messages:
      publicTrades:
        $ref: '#/components/messages/publicTrades'
  myTrades:
    address: my-trades
    description: Your fills. Authentication required.
    messages:
      myTrades:
        $ref: '#/components/messages/myTrades'
  myOrders:
    address: my-orders
    description: Your order updates. Authentication required.
    messages:
      myOrders:
        $ref: '#/components/messages/myOrders'
  executions:
    address: executions
    description: Combined my-orders and my-trades stream. Authentication required.
    messages:
      executions:
        $ref: '#/components/messages/executions'
  myBalance:
    address: my-balance
    description: Balance changes. Authentication required.
    messages:
      myBalance:
        $ref: '#/components/messages/myBalance'
  myWorkingCapital:
    address: my-working-capital
    description: Working capital limit changes. Authentication required.
    messages:
      myWorkingCapital:
        $ref: '#/components/messages/myWorkingCapital'
  authenticate:
    address: authenticate
    description: Send event authenticate with token from POST /v1/signin/apikey within 1 minute.
    messages:
      authenticate:
        $ref: '#/components/messages/authenticate'
operations:
  receiveOrderBook:
    action: receive
    channel:
      $ref: '#/channels/orderBook'
  receivePublicTrades:
    action: receive
    channel:
      $ref: '#/channels/publicTrades'
  receiveMyTrades:
    action: receive
    channel:
      $ref: '#/channels/myTrades'
  receiveMyOrders:
    action: receive
    channel:
      $ref: '#/channels/myOrders'
  receiveExecutions:
    action: receive
    channel:
      $ref: '#/channels/executions'
  receiveMyBalance:
    action: receive
    channel:
      $ref: '#/channels/myBalance'
  receiveMyWorkingCapital:
    action: receive
    channel:
      $ref: '#/channels/myWorkingCapital'
  sendAuthenticate:
    action: send
    channel:
      $ref: '#/channels/authenticate'
components:
  messages:
    orderBook:
      name: orderBook
      payload:
        type: object
        properties:
          event:
            type: string
            examples:
              - order-book
          symbol:
            type: string
            examples:
              - B2M/EUR
          data:
            type: object
            properties:
              bids:
                type: array
                items: {}
              asks:
                type: array
                items: {}
              nonce:
                type: number
    publicTrades:
      name: publicTrades
      payload:
        type: object
        properties:
          event:
            type: string
            examples:
              - public-trades
          symbol:
            type: string
          data:
            type: object
            properties:
              side:
                type: string
              price:
                type: number
              amount:
                type: number
              timestamp:
                type: number
    myTrades:
      name: myTrades
      payload:
        type: object
        properties:
          event:
            type: string
            examples:
              - my-trades
          symbol:
            type: string
          data:
            type: object
    myOrders:
      name: myOrders
      payload:
        type: object
        properties:
          event:
            type: string
            examples:
              - my-orders
          data:
            type: object
    executions:
      name: executions
      payload:
        type: object
    myBalance:
      name: myBalance
      payload:
        type: object
    myWorkingCapital:
      name: myWorkingCapital
      payload:
        type: object
    authenticate:
      name: authenticate
      payload:
        type: object
        required:
          - event
          - token
        properties:
          event:
            type: string
            examples:
              - authenticate
          token:
            type: string
